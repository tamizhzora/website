name = "my-video-site"
main = "index.js"
compatibility_date = "2026-08-16"

# KV namespace used for videos, users, series, etc.
# Replace "id" below with your real KV namespace ID (see instructions).
[[kv_namespaces]]
binding = "VIDEOS"
id = "723c6e44a6d9400cb5bb7b925116e61e"

# Non-secret vars can go here. Secrets (ADMIN_PASSWORD, LINK_SECRET) should
# NOT be put here — set them via `wrangler secret put` or the dashboard instead.
[vars]
DRIVE_PROXY_BASE = "https://my-drive-proxy.cliqzora.workers.dev/"
